name: Apps

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/apps.yml"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Что собирать"
        type: choice
        options: [all, ios, windows, android]
        default: all

permissions:
  contents: write

jobs:
  windows:
    name: Windows (WinUI 3)
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # x64 for ordinary PCs, ARM64 for Snapdragon / Surface laptops
          foreach ($a in @(@('win-x64','x64'), @('win-arm64','ARM64'))) {
            dotnet publish apps/windows/Echo/Echo.csproj -c Release -r $a[0] -p:Platform=$($a[1]) -p:RuntimeIdentifier=$($a[0]) -o "out/$($a[1])"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "out/$($a[1])/*" -DestinationPath "dist/Echo-Windows-$($a[1].ToLower()).zip"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Echo-Windows-x64.zip
            dist/Echo-Windows-arm64.zip

  ios:
    name: iOS (SwiftUI, unsigned IPA)
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild -project Echo.xcodeproj -scheme Echo -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Echo.app
      - name: Show errors
        if: failure()
        working-directory: apps/ios
        run: grep -E "error:" build.log | head -80 || true
      - name: Package IPA
        working-directory: apps/ios
        run: |
          mkdir -p Payload ../../dist
          cp -R build/Build/Products/Release-iphoneos/Echo.app Payload/
          zip -qry ../../dist/Echo.ipa Payload
      - name: Package TrollStore build (CarPlay)
        working-directory: apps/ios
        run: |
          brew install ldid
          rm -rf ts && mkdir ts && cp -R Payload ts/
          ldid -SSupport/CarPlay.entitlements ts/Payload/Echo.app/Echo
          ldid -e ts/Payload/Echo.app/Echo | grep -q carplay-audio
          (cd ts && zip -qry ../../../dist/Echo-TrollStore.tipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            dist/Echo.ipa
            dist/Echo-TrollStore.tipa

  android:
    name: Android (Kotlin, Compose, Android Auto)
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ECHO_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ECHO_KEYSTORE_PASSWORD }}
        run: |
          # With the repository's own key updates install over the old version; without it the build uses a
          # temporary debug key (works, but each update needs the old app removed first).
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.p12"
            PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
            echo "::add-mask::$PASS"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=echo" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: apps/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: mkdir -p dist && cp apps/android/app/build/outputs/apk/release/app-release.apk dist/Echo-Android.apk && ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/Echo-Android.apk

  release:
    name: Release
    needs: [windows, ios, android]
    if: always() && (needs.windows.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apps-${{ github.run_number }}"
          FILES=""
          NOTES=""
          if [ -f out/windows/Echo-Windows-x64.zip ]; then
            FILES="out/windows/Echo-Windows-x64.zip"
            NOTES="Windows: распакуйте Echo-Windows-x64.zip и запустите Echo.exe."
          fi
          if [ -f out/windows/Echo-Windows-arm64.zip ]; then
            FILES="$FILES out/windows/Echo-Windows-arm64.zip"
            NOTES="$NOTES Для ноутбуков на ARM (Snapdragon, Surface): Echo-Windows-arm64.zip."
          fi
          if [ -f out/android/Echo-Android.apk ]; then
            FILES="$FILES out/android/Echo-Android.apk"
            NOTES="$NOTES Android: установите Echo-Android.apk (разрешите установку из этого источника). Для Android Auto включите «Неизвестные источники» в режиме разработчика Android Auto."
          fi
          if [ -f out/ios/Echo.ipa ]; then
            FILES="$FILES out/ios/Echo.ipa"
            NOTES="$NOTES iPhone: Echo.ipa не подписан, установите через Sideloadly или AltStore (без CarPlay)."
            if [ -f out/ios/Echo-TrollStore.tipa ]; then
              FILES="$FILES out/ios/Echo-TrollStore.tipa"
              NOTES="$NOTES С CarPlay: Echo-TrollStore.tipa через TrollStore (разрешение CarPlay вшито в подпись, сертификат Apple не нужен)."
            fi
          else
            NOTES="$NOTES Сборка для iPhone в этот раз не получилась, она будет в следующем релизе."
          fi
          NOTES="$NOTES Инструкции по установке: https://music.maxsim.space/apps"
          gh release create "$TAG" --repo "${{ github.repository }}" --title "Эхо — приложения #${{ github.run_number }}" --notes "$NOTES" $FILES
